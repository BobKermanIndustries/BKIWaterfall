@PART[rmm_cotopaxi]:AFTER[z_BKI-Waterfall]
{
	!EFFECTS {}
    EFFECTS
    {
        running_engine
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 0.01 0.4
                volume = 1.0 1.0
                pitch = 0.0 0.2
                pitch = 0.01 0.6
                pitch = 1.0 1.8
                loop = true
            }
        }
        engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
        flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
    }
	@MODULE[ModuleWaterfallFX]{
		@TEMPLATE,0 {
			@templateName = BKIrowaterfall-hydrolox-ssme
			@position = 0,-0.02,0
			@rotation = 90, 0, 0
			@scale = 0.9, 0.9, 0.9
		}
	}
}
