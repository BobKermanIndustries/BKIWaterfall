@PART[bluedog_Saturn_Engine_F1]:AFTER[Bluedog_DB]:NEEDS[Waterfall]
{
	// Removes the stock effect block, and replace it with one that has no particles
	!EFFECTS {}
	EFFECTS
	{
		running_engine
		{
			AUDIO
			{
				channel = Ship
				clip = Bluedog_DB/Sounds/KatSounds/kero_loop_hard
				volume = 0.0 0.0
				volume = 0.01 0.1
				volume = 1.0 2.0
				pitch = 0.0 1.0
				pitch = 1.0 1.0
				loop = true
			}
		}
		running_f1B
		{
			AUDIO
			{
				channel = Ship
				clip = Bluedog_DB/Sounds/KatSounds/kero_loop_hard
				volume = 0.0 0.0
				volume = 0.01 0.1
				volume = 1.0 2.0
				pitch = 0.0 1
				pitch = 1.0 1
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				name = f1bExhaust
				modelName = Bluedog_DB/FX/FX_New/f1bExhaust
				transformName = exhaustFX
				emission = 0.0 0.0
				emission = 0.01 0.1
				emission = 1.0 1.0
				energy = 0.0 0.5
				energy = 1.0 1.0
				localPosition = 0, 0, 0
			 localScale = 1,1,1
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = Bluedog_DB/Sounds/KatSounds/sound_liq8_enhanced
				volume = 1.5
				pitch = 1.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 0.8
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = thrustTransform
				oneShot = true
				//localOffset = 0,0,1.8
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 0.8
				loop = false
			}
		}
	}
	@MODULE[ModuleWaterfallFX]
	{
		@TEMPLATE
		{
			@templateName = BKIKerloxLower-5Film
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    	{
        @SUBTYPE[F1B]
		{
			@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX]]]
			{
				@DATA
				{
					@TEMPLATE
					{
						@templateName = BKIKerloxLower-5
					}
				}
			}
		}
		@SUBTYPE[F1V]
		{
			@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX]]]
			{
				@DATA
				{
					@TEMPLATE
					{
						@templateName = BKIKerloxLower-5
					}
				}
			}
		}
		@SUBTYPE[F1AV]
		{
			@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX]]]
			{
				@DATA
				{
					@TEMPLATE
					{
						@templateName = BKIKerloxLower-5
					}
				}
			}
		}
		@SUBTYPE[F1CW]
		{
			@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleWaterfallFX]]]
			{
				@DATA
				{
					@TEMPLATE
					{
						@templateName = BKIKerloxLower-5
					}
				}
			}
		}
	}
}
@PART[bluedog_Saturn_Engine_F1]:BEFORE[Bluedog_DB]:NEEDS[z_BKI-Waterfall]
{
	MODEL 
	{
		model = z_BKI-Waterfall/Models/Particles
		scale = 2.95, 2.95, 2.95
	}
	MODULE
	{
		name = ModuleStagedAnimation
		staged = true
		animationName = Fireball
		waitForAnimation = true
		menuName = Show Fireball
	}
	MODULE
	{
		name = WBIAnimatedTexture
		debugMode = true

		moduleID = Smoke

		textureTransformName = particle
		animatedDiffuseTexture = z_BKI-Waterfall/Models/Particle_
		minFramesPerSecond = 29
		maxFramesPerSecond = 30
		fadesAtMinThrottle = false
		emissiveFadeTime = 0.1
	}
	MODULE
	{
		name = WBIAnimatedTextureActivate
		moduleID = Smoke   // only this one gets toggled on staging
	}
	MODULE
	{
		name = WBIAnimatedTextureActivate
		moduleID = Fire   // only this one gets toggled on staging
	}
		MODULE
	{
		name = WBIAnimatedTextureAlt
		debugMode = true

		moduleID = Fire

		textureTransformName = particleEmit
		animatedDiffuseTexture = z_BKI-Waterfall/Models/ParticleEmit_
		minFramesPerSecond = 29
		maxFramesPerSecond = 30
		fadesAtMinThrottle = false
		emissiveFadeTime = 0.1
	}
	MODULE
	{
		name = ModuleBillboardTransforms
		transformNames = particle, particleEmit
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		switcherDescription = Engine Config
		switcherDescriptionPlural = Engine Configs
		moduleID = IgnitionSwitch

		SUBTYPE
		{
			name = IgnitionFX
			title = Ignition effects enabled
			descriptionSummary = Enables custon mesh-particle driven engine ignition effects. Activates via staging.
			transform = BKI_F1_Fireball
		}
		SUBTYPE
		{
			name = NoIgnitionFX
			title = Ignition effects disabled
			descriptionSummary = Custon ignition effects disabled
		}
	}
}